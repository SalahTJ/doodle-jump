<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Doodle Jump</title>
<style>
:root{--sky1:#bfe6ff;--sky2:#fff1e0;--ink:#1c2433;--glass:rgba(255,255,255,.78);--line:rgba(28,36,51,.12);--accent:#6c5ce7;--on:#fff;--dim:rgba(28,36,51,.6);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#141a33;--sky2:#2b2250;--ink:#f1f3fb;--glass:rgba(30,36,64,.8);--line:rgba(255,255,255,.14);--accent:#a29bfe;--on:#141a33;--dim:rgba(241,243,251,.6);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#141a33;--sky2:#2b2250;--ink:#f1f3fb;--glass:rgba(30,36,64,.8);--line:rgba(255,255,255,.14);--accent:#a29bfe;--on:#141a33;--dim:rgba(241,243,251,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky1);z-index:10}
#wrap{height:100%;display:flex;justify-content:center;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;height:100%;max-width:100%;aspect-ratio:360/640}
canvas{width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px;box-sizing:border-box;background:rgba(0,0,0,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.screen.show{display:flex}
.card{width:100%;max-width:330px;max-height:100%;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{margin:0 0 4px;font-size:32px;letter-spacing:-.5px}h2{margin:0 0 14px;font-size:22px}
.sub{margin:0 0 18px;color:var(--dim);font-size:14px}
.big{font-size:44px;font-weight:800;margin:4px 0}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:16px;font:700 17px system-ui;background:var(--accent);color:var(--on);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{text-align:left;margin:14px 0 0}.row label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 13px system-ui;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on)}
.seg.sw button{height:34px;flex:0 0 auto;width:34px;border-radius:50%;margin:0 auto;border:3px solid transparent}
.seg.sw{background:transparent;padding:0;justify-content:space-between}.seg.sw button.on{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--dim);margin:6px 0 0;min-height:16px}
.qr{text-align:left;margin:9px 0;font-size:14px}.qr b{float:right;font-size:12px;color:var(--dim)}.qb{height:7px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden}.qb i{display:block;height:100%;background:var(--accent)}.qr.ok span::after{content:' ✓'}
#ncode{width:100%;box-sizing:border-box;margin-top:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 20px system-ui;text-align:center;letter-spacing:6px}
#fire{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:17px;font-weight:700;color:var(--ink);display:none;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sk{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:10px 6px;font:600 13px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.sk i{width:34px;height:34px;border-radius:50%}.sk em{font-style:normal;color:var(--dim);font-size:12px}.sk.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
#pb{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:16px;display:none;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.help p{margin:0 0 12px;text-align:left;font-size:15px;line-height:1.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<h1>Doodle Jump</h1><p class="sub">Прыгай как можно выше</p>
<div class="big" id="bestm">0</div><p class="sub" style="margin-top:0">рекорд</p><p class="sub" style="margin:0 0 4px">🪙 <b id="cn">0</b> монет</p>

<div class="screen" id="shop"><div class="card"><h2>Магазин скинов</h2><p class="sub">🪙 <b id="cn2">0</b> · монеты собирай в игре</p><div id="grid"></div><button class="btn" id="sback">Назад</button></div></div>

<div class='screen' id='quests'><div class='card'><h2>Задания дня</h2><div id='ql'></div><h2 style='margin-top:18px'>Достижения</h2><div id='al'></div><h2 style='margin-top:18px'>Статистика</h2><div id='stl'></div><button class='btn' id='qback'>Назад</button></div></div>
<div class='screen' id='online'><div class='card'><h2>Игра с другом</h2><p class='sub' id='nst'>Создай комнату или введи код друга</p><div id='nbox'></div>
<button class='btn' id='ncreate'>Создать комнату</button>
<input id='ncode' placeholder='Код друга' maxlength='4' inputmode='numeric'>
<button class='btn ghost' id='njoin'>Войти по коду</button>
<button class='btn' id='ngo' style='display:none'>Начать гонку</button>
<button class='btn ghost' id='nback'>Назад</button></div></div>

<div class="screen" id="help"><div class="card help"><h2>Как играть</h2><div id="hbody"></div>
<button class="btn" id="hgo">Понятно, играть!</button></div></div>

<div class="screen" id="pause"><div class="card"><h2>Пауза</h2>
<button class="btn" id="resume">Продолжить</button>
<button class="btn ghost" id="tomenu1">В меню</button></div></div>

<div class="screen" id="over"><div class="card"><h2>Игра окончена</h2>
<div class="big" id="fs">0</div><p class="sub" style="margin:0">очки</p>

<button class="btn" id="again">Ещё раз</button>
<button class="btn ghost" id="share">📤 Поделиться результатом</button>
<button class="btn ghost" id="tomenu2">В меню</button></div></div>
</div></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d'),W=360,H=640,DPR=Math.min(window.devicePixelRatio||1,3);
cv.width=W*DPR;cv.height=H*DPR;let rdt=1;
let S={ctrl:'touch',sens:5,theme:'auto',sound:'on',color:0,diff:'normal',fire:'btn',vib:'on',music:'on',coins:0,owned:[0]};
try{Object.assign(S,JSON.parse(localStorage.getItem('dj_s')||'{}'))}catch(e){}
let best=0;try{best=+localStorage.getItem('dj_best')||0}catch(e){}
const save=()=>{try{localStorage.setItem('dj_s',JSON.stringify(S))}catch(e){}};
const COLORS=[['#8de86a','#3fa02b'],['#ffb366','#e07b2a'],['#c3cbd9','#7d8ba3'],['#ffffff','#c9d3ff'],['#4a5470','#1c2233'],['#ffffff','#9fb4d8']];
const PRICE=[0,10,25,45,70,100],ICON=['🐥','🐱','🤖','👻','🐧','👨‍🚀'],NAMES=['Птенец','Кот','Робот','Призрак','Пингвин','Космонавт'],OLD=['Зелёный','Розовый','Синий','Золотой','Фиолетовый','Ниндзя','Космонавт','Король'];
const HINT={touch:'Держи левую или правую половину экрана',drag:'Двигай пальцем: персонаж едет за ним',tilt:'Наклоняй телефон влево и вправо'};
let hgt=0,boss=null,bossLvl=-1,ebs=[],shake=0,ammo=0,mid=null,bul=[],cool=0,mons=[],items=[],jet=0,sh=0,lvl=0,banner=null,frame=0,col={},P,plats,parts=[],bubbles=[],score=0,state='menu',dir=0,fx=null,tilt=0,keys={},ac=null;
for(let i=0;i<14;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:6+Math.random()*26,z:.15+Math.random()*.4});
function colors(){const s=getComputedStyle(document.documentElement);['sky1','sky2','ink','glass'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function apply(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);colors();
 document.querySelectorAll('.seg button').forEach(b=>{const on=String(S[b.parentNode.dataset.k])===b.dataset.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $('#sens').value=S.sens;$('#chint').textContent=HINT[S.ctrl];tiltHint()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',colors);
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.dataset.v=i;b.style.background=`linear-gradient(135deg,${c[0]},${c[1]})`;b.setAttribute('aria-label','Цвет '+(i+1));document.querySelector('.sw').appendChild(b)});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k,v=b.dataset.v;S[k]=k==='color'?+v:v;if(k==='ctrl'&&v==='tilt')askTilt();save();apply()});
$('#sens').oninput=e=>{S.sens=+e.target.value;save()};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let tiltOk=false,tiltSrc='';
function tiltHint(){if(S.ctrl==='tilt')$('#chint').textContent=tiltOk?'Датчик работает ✓':'Датчик не отвечает. Внутри claude.ai он может быть заблокирован: открой игру из скачанного файла или выбери другой режим'}
function setT(v,src){if(tiltOk&&tiltSrc!==src)return;tilt=v;if(!tiltOk){tiltOk=true;tiltSrc=src;tiltHint()}}
function askTilt(){try{[window.DeviceOrientationEvent,window.DeviceMotionEvent].forEach(E=>{if(E&&E.requestPermission)E.requestPermission().catch(()=>{})})}catch(e){}}
addEventListener('deviceorientation',e=>{if(e.gamma!=null)setT(e.gamma,'o')});
addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(a&&a.x!=null&&!(tiltOk&&tiltSrc==='o'))setT((isIOS?1:-1)*a.x/9.8*45,'m')});
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));$('#pb').style.display=state==='play'&&!net.race?'block':'none';$('#fire').style.display=state==='play'&&S.fire==='btn'?'block':'none';$('#bestm').textContent=best;$('#cn').textContent=S.coins;$('#cn2').textContent=S.coins;
 if(id==='over'){$('#live').textContent='Игра окончена. Очки: '+score;$('#share').style.display=net.race?'none':'block';$('#share').textContent='📤 Поделиться результатом'}
 if(id){const t=document.querySelector('#'+id+' button');if(t)try{t.focus({preventScroll:true})}catch(e){}}}
let from='menu';
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{from=state;if(b.dataset.open==='online'&&!net.on)ns('Создай комнату или введи код друга');if(b.dataset.open==='quests')renderQ();if(b.dataset.open==='shop')renderShop();show(b.dataset.open)});
$('#back').onclick=()=>show('menu');
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches,RM=matchMedia('(prefers-reduced-motion:reduce)');
function go(){net.race=false;if(!S.seen){helpShow();return}start()}
function helpShow(){const l=[['🎮',HINT[S.ctrl]+(FINE?'. Также: ← → или A D':'')],['🪙','Собирай монеты — за них открываются скины'],['💥','Стреляй по монстрам, когда есть патроны'+(FINE?' (Пробел)':'')],['⚠️','Не падай вниз и обходи монстров']];
 $('#hbody').innerHTML=l.map(x=>'<p>'+x[0]+' '+x[1]+'</p>').join('');show('help')}
$('#hgo').onclick=()=>{S.seen=1;save();start()};
const dh=t=>{$('#dhint').textContent=t};
async function exportData(){chk();
 const data={app:'doodle-jump',v:1,date:new Date().toISOString(),best,coins:S.coins,owned:S.owned,color:S.color,st:S.st};
 const name='doodle-jump-progress.json',blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Doodle Jump: прогресс'});dh('Файл готов ✓');return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);dh('Файл сохранён ✓')}
function importData(txt){
 let d;try{d=JSON.parse(txt)}catch(e){return 'Это не файл прогресса'}
 if(!d||d.app!=='doodle-jump'||d.v!==1)return 'Это не файл прогресса Doodle Jump';
 const num=(x,max)=>Number.isFinite(x)&&x>=0&&x<=max?Math.floor(x):null;
 const coins=num(d.coins,1e7),bst=num(d.best,1e9);
 if(coins===null||bst===null||!Array.isArray(d.owned)||!d.st||typeof d.st!=='object')return 'Файл повреждён';
 const owned=[...new Set([0,...d.owned.filter(i=>Number.isInteger(i)&&i>=0&&i<COLORS.length)])];
 const st={kills:0,coins:0,bosses:0,games:0,shots:0,wins:0,best:0};
 for(const k in st){const v=num(d.st[k],1e9);if(v!==null)st[k]=v}
 if(!confirm('Заменить текущий прогресс (монеты, скины, статистику) данными из файла?'))return 'Отменено';
 S.coins=coins;S.owned=owned;S.st=st;S.color=owned.includes(d.color)?d.color:0;
 best=Math.max(best,bst);try{localStorage.setItem('dj_best',best)}catch(e){}
 save();show('settings');return 'Прогресс загружен ✓'}
$('#exp').onclick=exportData;
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(f.size>200000){dh('Файл слишком большой');return}
 f.text().then(t=>dh(importData(t))).catch(()=>dh('Не удалось прочитать файл'))};
$('#share').onclick=async()=>{
 const text='Я набрал '+score+' очков в Doodle Jump! 🐥 Сможешь больше?',url=location.href.split('#')[0];
 try{if(navigator.share){await navigator.share({title:'Doodle Jump',text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text+' '+url);$('#share').textContent='Скопировано ✓'}catch(e){$('#share').textContent='Не удалось скопировать'}};
$('#play').onclick=go;
if(FINE)$('#khint').style.display='block';
document.querySelectorAll('.screen').forEach(s=>{s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');const h=s.querySelector('h1,h2');if(h){h.id=h.id||s.id+'-t';s.setAttribute('aria-labelledby',h.id)}});
document.querySelectorAll('.seg').forEach(g=>{g.setAttribute('role','group');const l=g.parentNode.querySelector('label');if(l)g.setAttribute('aria-label',l.textContent)});$('#again').onclick=()=>{if(net.race){if(net.host&&net.on){const sd=Date.now()%1e9;nsend({t:'go',seed:sd});raceStart(sd)}}else start()};
$('#tomenu1').onclick=$('#tomenu2').onclick=()=>{netReset();net.race=false;state='menu';show('menu')};
$('#pb').onclick=pause;$('#resume').onclick=()=>{state='play';show('')};
function pause(){if(net.race)return;if(state==='play'){state='pause';show('pause')}else if(state==='pause'){state='play';show('')}}
